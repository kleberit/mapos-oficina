version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - "./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "../:/var/www/html"
      - "./etc/nginx/default.template.conf:/etc/nginx/conf.d/default.template"
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    env_file:
      - ".env"
    command: /bin/sh -c "envsubst '$$NGINX_HOST $$NGINX_PORT' < /etc/nginx/conf.d/default.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: always
    depends_on:
      - php-fpm
      - mysql

  php-fpm:
    container_name: php-fpm
    build:
      context: ..
      dockerfile: docker/etc/php/Dockerfile
    restart: always
    volumes:
      - "./etc/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "./etc/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini"
      # Só o que precisa ser lido/escrito em tempo real fica montado do host
      # (o restante do código PHP e o vendor/ já vêm "assados" dentro da imagem -
      # ler dezenas de arquivos PHP por requisição através do bind mount
      # Windows -> WSL2 é o principal motivo do sistema ficar lento no Docker Desktop).
      - "../application/.env:/var/www/html/application/.env"
      - "../application/logs:/var/www/html/application/logs"
      - "../application/cache:/var/www/html/application/cache"
      - "../assets/uploads:/var/www/html/assets/uploads"
      - "../assets/userImage:/var/www/html/assets/userImage"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "${PHP_MY_ADMIN_PORT}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=${MYSQL_MAPOS_HOST}
      - PMA_USER=${MYSQL_MAPOS_USER}
      - PMA_PASSWORD=${MYSQL_MAPOS_PASSWORD}
    restart: always
    depends_on:
      - mysql

  mysql:
    image: mysql:${MYSQL_MAPOS_VERSION}
    container_name: mysql
    restart: always
    env_file:
      - ".env"
    environment:
      - MYSQL_DATABASE=${MYSQL_MAPOS_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_MAPOS_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_MAPOS_USER}
      - MYSQL_PASSWORD=${MYSQL_MAPOS_PASSWORD}
    ports:
      - "${MYSQL_MAPOS_PORT}:3306"
    volumes:
      - "mapos_mysql_data:/var/lib/mysql"

volumes:
  mapos_mysql_data:
